services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Overridable so an existing deployment can keep pointing at the file it
      # already has inside the volume. See README, "Upgrading an existing deployment".
      - DATABASE_PATH=${DATABASE_PATH:-/data/cms.db}
      - VITE_SITE_URL=${VITE_SITE_URL:-}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set — see .env.example}
      # Host header allowlist for the production preview server. Unset means every
      # request is refused with "Blocked request", so set it to your domain(s).
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # Empty by default: this compose file publishes the port directly, with no
      # proxy in front, so rate limits must key on the socket peer address.
      # Set it only when a proxy that overwrites the header fronts the app AND
      # the app is not reachable around it — see README "Running behind a proxy".
      - TRUSTED_PROXY_HEADER=${TRUSTED_PROXY_HEADER:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      # Where the contact form delivers. Unset means submissions are stored and
      # logged but not emailed.
      - MAIL_TO=${MAIL_TO:-}
      - BARAY_API_KEY=${BARAY_API_KEY:-}
      - BARAY_SK=${BARAY_SK:-}
      - BARAY_IV=${BARAY_IV:-}
      # These three are validated as URLs (z.string().url()) with code-level
      # defaults/optionality — bare name (no `=` value) means Compose only sets
      # them when actually present in .env/shell, instead of forcing "".
      - R2_PUBLIC_URL
      - BARAY_API_URL
      - BARAY_PAY_URL
    volumes:
      - cms-data:/data
      - cms-uploads:/app/public/uploads
    restart: unless-stopped

# UPGRADING AN EXISTING DEPLOYMENT - the full procedure is in README, "Upgrading
# an existing deployment". Read it BEFORE `docker compose up`, whether or not you
# use this file: three things changed name or became required, and nothing warns
# you. In short:
#
#   - the volumes were kape-data / kape-uploads
#   - the database file inside was kape.db
#   - ALLOWED_HOSTS is new and mandatory; unset, every request 403s
#
# Compose will not tell you about the first two. It creates the new, empty
# volumes, the installer sees a first boot, and the site comes back blank while
# the old data sits untouched where it always was.
#
# Nothing here needs editing to keep an existing deployment working: put
# DATABASE_PATH and ALLOWED_HOSTS in .env and the volume names in an untracked
# docker-compose.override.yml, as the README shows, so the next `git pull` does
# not conflict with your deployment.
volumes:
  cms-data:
  cms-uploads:
